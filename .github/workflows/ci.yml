name: CI
on:
  push:
    branches: [ main, develop, feature/*, chore/*, fix/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        if: runner.os == 'Linux'
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          else
            echo "rg already installed"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Find solution or project
        id: findproj
        run: |
          set -e
          # Try using rg (fast). If rg finds nothing, fall back to git ls-files.
          project_path=""
          if command -v rg >/dev/null 2>&1; then
            project_path=$(rg --files --glob '**/*.sln' --glob '!**/bin/**' --glob '!**/obj/**' | head -n 1 || true)
            if [ -z "$project_path" ]; then
              project_path=$(rg --files --glob '**/*.csproj' --glob '!**/bin/**' --glob '!**/obj/**' | head -n 1 || true)
            fi
          fi

          if [ -z "$project_path" ]; then
            project_path=$(git ls-files '*.sln' | head -n 1 || true)
          fi
          if [ -z "$project_path" ]; then
            project_path=$(git ls-files '*.csproj' | head -n 1 || true)
          fi

          if [ -n "$project_path" ]; then
            echo "project_path=$project_path" >> $GITHUB_OUTPUT
            echo "Found project: $project_path"
            exit 0
          fi

          echo "No .sln or .csproj found in repository"
          exit 1

      - name: Ensure UTF-8 encoding and commit changes
        env:
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: actions@github.com
        run: |
          set -euo pipefail

          # Install required packages
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends file git python3 python3-pip libc-bin
          python3 -m pip install --user chardet --disable-pip-version-check >/dev/null

          # Prepare python helper script (safe heredoc quoting)
          cat > /tmp/convert_to_utf8.py <<'PY'
import sys, chardet
path = sys.argv[1]
with open(path, 'rb') as f:
    data = f.read()
det = chardet.detect(data)
enc = det.get('encoding') or 'utf-8'
try:
    text = data.decode(enc, errors='strict')
except Exception:
    text = data.decode(enc, errors='replace')
with open(path, 'w', encoding='utf-8', newline='') as f:
    f.write(text)
PY

          globs=( '*.cs' '*.xaml' '*.axaml' '*.config' '*.csproj' '*.sln' '*.md' '*.txt' )
          changed=false
          tmpfile=$(mktemp)

          find_files() {
            for g in "${globs[@]}"; do
              git ls-files -- "$g" || true
            done | sort -u
          }

          files=$(find_files)
          if [ -z "$files" ]; then
            echo "No candidate files found; skipping encoding normalization."
            exit 0
          fi

          for f in $files; do
            [ -f "$f" ] || continue
            size=$(stat -c%s "$f" || echo 0)
            [ "$size" -le $((1024*1024)) ] || continue

            enc=$(file -i "$f" 2>/dev/null | awk -F'charset=' '{print $2}' | tr -d ' \n' || true)
            enc=${enc:-utf-8}
            enc=$(echo "$enc" | tr '[:upper:]' '[:lower:]')

            if [[ "$enc" == "utf-8" || "$enc" == "us-ascii" ]]; then
              continue
            fi

            echo "Converting $f from $enc to UTF-8..."
            if iconv -f "$enc" -t UTF-8 "$f" -o "$tmpfile" 2>/dev/null; then
              if ! cmp -s "$f" "$tmpfile"; then
                mv "$tmpfile" "$f"
                changed=true
                echo "Converted: $f"
              fi
            else
              echo "iconv failed for $f; trying python fallback..."
              python3 /tmp/convert_to_utf8.py "$f"
              changed=true
              echo "Converted via python: $f"
            fi
          done

          rm -f "$tmpfile" /tmp/convert_to_utf8.py

          if [ "$changed" = true ] ; then
            git config user.name "$GIT_COMMITTER_NAME"
            git config user.email "$GIT_COMMITTER_EMAIL"
            git add -A
            git --no-pager diff --staged --name-only || true
            git commit -m "ci: normalize text file encodings to UTF-8 (automated)" || true
            git push origin HEAD:"${GITHUB_REF##*/}" || {
              echo "Push failed; check repository Actions write permissions for GITHUB_TOKEN."
              exit 1
            }
            echo "Committed and pushed encoding fixes."
          else
            echo "No encoding changes needed."
          fi
          
      - name: Restore
        run: |
          dotnet restore "${{ steps.findproj.outputs.project_path }}"

      - name: Build
        run: |
          dotnet build "${{ steps.findproj.outputs.project_path }}" --no-restore -c Release

      - name: Test
        run: |
          if [[ "${{ steps.findproj.outputs.project_path }}" == *.sln ]]; then
            dotnet test "${{ steps.findproj.outputs.project_path }}" --no-build -c Release --verbosity normal
          else
            dotnet test --no-build -c Release --verbosity normal
          fi

      - name: Async void guard
        run: |
          if [ -f ./scripts/find_async_void.sh ]; then
            bash ./scripts/find_async_void.sh
          else
            echo "No async-void guard script found"
          fi

      - name: Format check
        run: |
          set -euo pipefail
          proj="${{ steps.findproj.outputs.project_path }}"
          if [ -z "$proj" ]; then
            echo "No project_path found; skipping format check"
            exit 0
          fi
          projdir=$(dirname "$proj")
          workspace=$(basename "$proj")
          echo "Running format in: $projdir (workspace: $workspace)"
          cd "$projdir"
          dotnet tool restore || true
          dotnet format "$workspace" --verify-no-changes

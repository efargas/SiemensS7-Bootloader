name: CI
on:
  push:
    branches: [ main, develop, feature/*, chore/*, fix/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: [ '8.0.x' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        if: runner.os == 'Linux'
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ripgrep
          else
            echo "rg already installed"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Find solution or project
        id: findproj
        run: |
          set -e
          # Try using rg (fast). If rg finds nothing, fall back to git ls-files.
          project_path=""
          if command -v rg >/dev/null 2>&1; then
            project_path=$(rg --files --glob '**/*.sln' --glob '!**/bin/**' --glob '!**/obj/**' | head -n 1 || true)
            if [ -z "$project_path" ]; then
              project_path=$(rg --files --glob '**/*.csproj' --glob '!**/bin/**' --glob '!**/obj/**' | head -n 1 || true)
            fi
          fi

          if [ -z "$project_path" ]; then
            project_path=$(git ls-files '*.sln' | head -n 1 || true)
          fi
          if [ -z "$project_path" ]; then
            project_path=$(git ls-files '*.csproj' | head -n 1 || true)
          fi

          if [ -n "$project_path" ]; then
            echo "project_path=$project_path" >> $GITHUB_OUTPUT
            echo "Found project: $project_path"
            exit 0
          fi

          echo "No .sln or .csproj found in repository"
          exit 1

      - name: Ensure UTF-8 encoding and commit changes
        env:
          GIT_COMMITTER_NAME: github-actions
          GIT_COMMITTER_EMAIL: actions@github.com
        run: |
          set -euo pipefail

          # Files to consider (space-separated globs)
          globs=( '*.cs' '*.xaml' '*.axaml' '*.config' '*.csproj' '*.sln' '*.md' '*.txt' )

          # Temporary file for conversion
          changed=false
          tmpfile=$(mktemp)

          # Find candidate files, excluding .git, bin, obj
          find_files() {
            for g in "${globs[@]}"; do
              # use git ls-files if available to limit to tracked files
              if command -v git >/dev/null 2>&1; then
                git ls-files -- "$g" || true
              else
                find . -type f -name "$g" -not -path './.git/*' -not -path '*/bin/*' -not -path '*/obj/*' -print
              fi
            done | sort -u
          }

          files=$(find_files)

          if [ -z "$files" ]; then
            echo "No candidate files found; skipping encoding normalization."
            exit 0
          fi

          echo "Checking encoding for candidate files..."

          # Ensure iconv is present
          if ! command -v iconv >/dev/null 2>&1; then
            echo "Installing iconv (libc-bin provided) on runner..."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libc-bin
          fi

          for f in $files; do
            # skip if file removed or not regular
            [ -f "$f" ] || continue

            # skip large files > 1MB (likely not source)
            size=$(stat -c%s "$f")
            if [ "$size" -gt $((1024*1024)) ]; then
              continue
            fi

            # detect mime/charset
            # file -i returns like: text/plain; charset=us-ascii
            mime=$(file -i --mime-encoding -b "$f" 2>/dev/null || true)
            # Normalize output: some systems return "binary", others "unknown-8bit"
            if [ -z "$mime" ]; then
              mime="unknown"
            fi

            # If tool claims binary, skip
            case "$mime" in
              binary|unknown|application/*) continue ;;
            esac

            # Try to detect common encodings with file -i (fallback if inaccurate)
            enc=$(file -i "$f" 2>/dev/null | awk -F'charset=' '{print $2}' | tr -d ' \n' || true)
            if [ -z "$enc" ]; then
              enc="utf-8"
            fi

            # Normalize enc to lower
            enc=$(echo "$enc" | tr '[:upper:]' '[:lower:]')

            # If already utf-8 or us-ascii, skip conversion
            if [[ "$enc" == "utf-8" || "$enc" == "us-ascii" ]]; then
              continue
            fi

            # Attempt conversion: iconv -f <enc> -t UTF-8
            echo "Converting $f from $enc to UTF-8..."
            if iconv -f "$enc" -t UTF-8 "$f" -o "$tmpfile" 2>/dev/null; then
              # Replace only if content changed
              if ! cmp -s "$f" "$tmpfile"; then
                mv "$tmpfile" "$f"
                changed=true
                echo "Converted: $f"
              else
                echo "No change after conversion: $f"
              fi
            else
              echo "iconv failed for $f with encoding $enc; trying fallback guesses..."

              # Try common fallbacks
              for tryenc in windows-1252 iso-8859-1 cp1252 latin1; do
                if iconv -f "$tryenc" -t UTF-8 "$f" -o "$tmpfile" 2>/dev/null; then
                  if ! cmp -s "$f" "$tmpfile"; then
                    mv "$tmpfile" "$f"
                    changed=true
                    echo "Converted $f using fallback $tryenc"
                  fi
                  break
                fi
              done
            fi
          done

          rm -f "$tmpfile"

          if [ "$changed" = true ] ; then
            echo "Encoding conversions made; committing changes..."
            git config user.name "$GIT_COMMITTER_NAME"
            git config user.email "$GIT_COMMITTER_EMAIL"
            git add -A
            # Show short diff for CI log
            git --no-pager diff --staged --name-only || true
            git commit -m "ci: normalize text file encodings to UTF-8 (automated)" || true
            # Push back using workflow token
            git push origin HEAD:"${GITHUB_REF##*/}" || {
              echo "Push failed; you may need to enable write permissions for GITHUB_TOKEN or use a personal access token."
              exit 1
            }
            echo "Committed and pushed encoding fixes."
          else
            echo "No encoding changes needed."
          fi
          
      - name: Restore
        run: |
          dotnet restore "${{ steps.findproj.outputs.project_path }}"

      - name: Build
        run: |
          dotnet build "${{ steps.findproj.outputs.project_path }}" --no-restore -c Release

      - name: Test
        run: |
          if [[ "${{ steps.findproj.outputs.project_path }}" == *.sln ]]; then
            dotnet test "${{ steps.findproj.outputs.project_path }}" --no-build -c Release --verbosity normal
          else
            dotnet test --no-build -c Release --verbosity normal
          fi

      - name: Async void guard
        run: |
          if [ -f ./scripts/find_async_void.sh ]; then
            bash ./scripts/find_async_void.sh
          else
            echo "No async-void guard script found"
          fi

      - name: Format check
        run: |
          set -euo pipefail
          proj="${{ steps.findproj.outputs.project_path }}"
          if [ -z "$proj" ]; then
            echo "No project_path found; skipping format check"
            exit 0
          fi
          projdir=$(dirname "$proj")
          workspace=$(basename "$proj")
          echo "Running format in: $projdir (workspace: $workspace)"
          cd "$projdir"
          dotnet tool restore || true
          dotnet format "$workspace" --verify-no-changes

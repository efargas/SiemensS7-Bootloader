name: CI

on:
  push:
    branches: [ main, cancellation-and-fire-and-forget-2 ]
  pull_request:
    branches: [ main, cancellation-and-fire-and-forget-2 ]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # runner.* expressions are allowed at job-level env
      NUGET_PACKAGES: ${{ runner.temp }}/.nuget/packages
    strategy:
      matrix:
        dotnet: [8.0.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-dotnet-${{ matrix.dotnet }}-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-dotnet-${{ matrix.dotnet }}-

      - name: Restore (repo)
        run: dotnet restore

      - name: Restore dotnet-format tool (tests project) if present
        working-directory: ./tests/S7.Tests
        run: |
          if [ -f .config/dotnet-tools.json ]; then
            echo "Restoring dotnet tools in tests/S7.Tests"
            dotnet tool restore
          else
            echo "No tool manifest at tests/S7.Tests/.config/dotnet-tools.json; skipping dotnet tool restore."
          fi

      - name: Format check (tests project) if tool manifest present
        working-directory: ./tests/S7.Tests
        run: |
          set -e
          if [ -f .config/dotnet-tools.json ]; then
            echo "Running dotnet format --verify-no-changes in tests/S7.Tests"
            if ! dotnet format --verify-no-changes; then
              echo "Code formatting required. Run 'dotnet format' in tests/S7.Tests locally." >&2
              exit 1
            fi
          else
            echo "No dotnet-format manifest; skipping format check."
          fi

      - name: Build all projects (Release)
        run: |
          if [ -f ./src/Solution.sln ]; then
            dotnet build ./src/Solution.sln --configuration Release --no-restore
          else
            dotnet build --configuration Release --no-restore
          fi

      - name: Run tests (explicit csproj)
        run: dotnet test ./tests/S7.Tests/S7.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'

      - name: Clean up stale partial files (best-effort)
        if: always()
        run: |
          echo "Cleaning .partial files from workspace (best-effort)"
          find $RUNNER_TEMP -type f -name "*.partial" -maxdepth 4 -print -delete || true

      - name: Show disk usage (debug)
        if: always()
        run: df -h || true

      - name: List workspace (debug)
        if: always()
        run: ls -la || true
